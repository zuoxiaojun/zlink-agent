version: '1.0'
name: build-mac-client
displayName: 构建 macOS 客户端

variables:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

pipeline:
  agent:
    image: macos
    type: VM
  stages:
    - name: build
      displayName: 构建
      jobs:
        - name: build-mac
          displayName: 构建 macOS .dmg
          steps:
            - checkout: {}

            - run: |
                echo "===== Install Python deps ====="
                python3 -m venv .venv
                source .venv/bin/activate
                pip install -r requirements.txt
                pip install pyinstaller

            - run: |
                echo "===== Build frontend ====="
                cd web
                npm ci
                npm run build
                cd ..

            - run: |
                echo "===== PyInstaller ====="
                source .venv/bin/activate
                pyinstaller backend/ys-agent.spec --clean --noconfirm

            - run: |
                echo "===== electron-builder ====="
                npm ci
                npx electron-builder --mac --config electron-builder.yml

            - run: |
                echo "===== Upload artifact ====="
                mkdir -p artifacts
                cp dist/YS-Agent-*.dmg artifacts/

            - archive:
                artifacts: artifacts/*
                target: artifacts
