<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>ZLink Agent</title>
<style>
  /* 与前端 global.css 设计系统保持一致（浅色 Ant/Arco 风格）。
     严禁 -webkit-app-region: drag —— 整页拖拽区会在 loadURL 跳转后残留，
     导致正式页面所有鼠标事件被系统拿去拖窗口（2026-07-18 事故）。 */
  html, body {
    margin: 0;
    height: 100%;
    background: #F2F3F5;            /* --bg-page */
    color: #1D2129;                 /* --text-1 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    cursor: default;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: #FFFFFF;            /* --bg-card */
    border: 1px solid #E5E6EB;      /* --border */
    border-radius: 16px;            /* --radius-lg */
    box-shadow: 0 4px 16px rgba(0,0,0,0.08); /* --shadow-lg */
    padding: 44px 64px 36px;
    text-align: center;
  }
  .logo-tile {
    width: 72px;
    height: 72px;
    margin: 0 auto 18px;
    border-radius: 18px;
    box-shadow: 0 2px 8px rgba(212,56,56,0.25);
  }
  .brand {
    font-size: 22px;
    font-weight: 700;
    color: #D43838;                 /* --primary */
    letter-spacing: -0.01em;
  }
  .slogan {
    margin-top: 2px;
    font-size: 12px;
    color: #86909C;                 /* --text-3 */
  }
  .spinner {
    width: 28px; height: 28px;
    margin: 26px auto 12px;
    border: 3px solid rgba(212,56,56,0.15);
    border-top-color: #D43838;      /* --primary */
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tip {
    font-size: 13px;
    color: #86909C;                 /* --text-3 */
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="logo-tile" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FEB75D"/>
          <stop offset="0.55" stop-color="#FD7A50"/>
          <stop offset="1" stop-color="#F5456B"/>
        </linearGradient>
      </defs>
      <rect width="72" height="72" rx="18" fill="url(#g)"/>
      <path d="M24 29c-4 0-7 3.1-7 7s3 7 7 7c7.8 0 10.7-14 12-14s4.2 14 12 14c4 0 7-3.1 7-7s-3-7-7-7c-7.8 0-10.7 14-12 14s-4.2-14-12-14z"
            fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
    </svg>
    <div class="brand">ZLink Agent</div>
    <div class="slogan">多 ERP AI 助手</div>
    <div class="spinner"></div>
    <div class="tip">正在启动后端服务，首次启动可能需要 20 秒…</div>
  </div>
</body>
</html>
