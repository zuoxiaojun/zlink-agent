<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
<title>智链 Agent</title>
<style>
  /* 与前端 global.css 设计系统保持一致（浅色 Ant/Arco 风格）。
     严禁 -webkit-app-region: drag —— 整页拖拽区会在 loadURL 跳转后残留，
     导致正式页面所有鼠标事件被系统拿去拖窗口（2026-07-18 事故）。 */
  html, body {
    margin: 0;
    height: 100%;
    background: #F2F3F5;            /* --bg-page */
    color: #1D2129;                 /* --text-1 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    cursor: default;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: #FFFFFF;            /* --bg-card */
    border: 1px solid #E5E6EB;      /* --border */
    border-radius: 16px;            /* --radius-lg */
    box-shadow: 0 4px 16px rgba(0,0,0,0.08); /* --shadow-lg */
    padding: 44px 64px 36px;
    text-align: center;
  }
  .logo-tile {
    width: 72px;
    height: 72px;
    margin: 0 auto 18px;
    border-radius: 18px;
    box-shadow: 0 2px 8px rgba(212,56,56,0.25);
  }
  .brand {
    font-size: 22px;
    font-weight: 700;
    color: #D43838;                 /* --primary */
    letter-spacing: -0.01em;
  }
  .slogan {
    margin-top: 2px;
    font-size: 12px;
    color: #86909C;                 /* --text-3 */
  }
  .spinner {
    width: 28px; height: 28px;
    margin: 26px auto 12px;
    border: 3px solid rgba(212,56,56,0.15);
    border-top-color: #D43838;      /* --primary */
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tip {
    font-size: 13px;
    color: #86909C;                 /* --text-3 */
  }
</style>
