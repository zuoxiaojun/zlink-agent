# electron-builder configuration for ZLink Agent
#   npx electron-builder --mac --config electron-builder.yml   # macOS .dmg
#   npx electron-builder --win --config electron-builder.yml   # Windows .exe

appId: com.zlink.agent
productName: ZLink Agent
copyright: Copyright 2026

directories:
  output: dist-electron
  buildResources: packaging

files:
  - electron/**/*
  - web/dist/**/*

asarUnpack:
  - web/dist/**

asar: true

extraResources:
  # PyInstaller 打包的后端单文件二进制 (build by scripts/build-pyinstaller.sh)
  - from: dist/zlink-backend
    to: .
  # Chart MCP server (预置, npx @antv/mcp-server-chart)
  - from: node_modules/@antv/mcp-server-chart/
    to: mcp-chart
    filter:
      - "**/*"

mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: [arm64]
  icon: packaging/app.icns
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: packaging/app-icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
