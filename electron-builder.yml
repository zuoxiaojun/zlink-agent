# electron-builder configuration for ZLink Agent
#   npx electron-builder --mac --config electron-builder.yml   # macOS .dmg
#   npx electron-builder --win --config electron-builder.yml   # Windows .exe

appId: com.zlink.agent
productName: ZLink Agent
copyright: Copyright 2026

directories:
  output: dist-electron
  buildResources: packaging

files:
  - electron/**/*
  - web/dist/**/*

asarUnpack:
  - web/dist/**

asar: true

extraResources:
  # PyInstaller onedir 后端目录 (build by scripts/build-pyinstaller.sh)
  # 可执行文件: zlink-backend/zlink-backend (macOS/Linux) | zlink-backend/zlink-backend.exe (Windows)
  - from: dist/zlink-backend
    to: zlink-backend
    filter:
      - "**/*"
  # Chart MCP server (预置, npx @antv/mcp-server-chart)
  - from: node_modules/@antv/mcp-server-chart/
    to: mcp-chart
    filter:
      - "**/*"

mac:
  category: public.app-category.business
  # 架构不在这里固定：由 scripts/build-electron.sh 传入的 --arm64 / --x64 CLI 参数决定，
  # 每次只构建一个架构（后端 PyInstaller 产物按架构构建，不能与外壳混用）。
  # artifactName 显式带 arch，产出 ZLink Agent-<ver>-arm64.dmg / -x64.dmg。
  target:
    - dmg
  artifactName: "${productName}-${version}-${arch}.${ext}"
  icon: packaging/app.icns
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: packaging/app-icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
