# electron-builder configuration for ZLink Agent
#   npx electron-builder --mac --config electron-builder.yml   # macOS .dmg
#   npx electron-builder --win --config electron-builder.yml   # Windows .exe
#   npx electron-builder --linux --config electron-builder.yml # Linux .AppImage

appId: com.zlink.agent
productName: ZLink Agent
copyright: Copyright 2026

directories:
  output: dist-electron
  buildResources: packaging

files:
  - electron/**/*
  - web/dist/**/*

# Python 后端: 用户需自行安装 Python 3.11+ 和 pip install zlink-agent
# 或通过 scripts/bundle-python.sh 打包后端（后续添加）

mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: packaging/app.icns
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: packaging/app-icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
  icon: packaging/app-icon.png
