# electron-builder configuration for ZLink Agent
#   npx electron-builder --mac --config electron-builder.yml   # macOS .dmg
#   npx electron-builder --win --config electron-builder.yml   # Windows .exe
#   npx electron-builder --linux --config electron-builder.yml # Linux .AppImage

appId: com.zlink.agent
productName: ZLink Agent
copyright: Copyright 2026

directories:
  output: dist-electron
  buildResources: packaging

files:
  - electron/**/*
  - web/dist/**/*

extraResources:
  # 自包含 Python 运行环境 (build by scripts/bundle-python.sh)
  - from: build/python-bundle/
    to: python-bundle
    filter:
      - "**/*"
  # 项目源码 (backend/ agent/ mcp_server/ 等) — filter 用正向 glob 包含
  - from: .
    to: app
    filter:
      - "backend/**/*.py"
      - "agent/**/*.py"
      - "mcp_server/**/*.py"
      - "scripts/**/*.py"
      - "packaging/**/*"
      - "VERSION"
      - "requirements.txt"
      - "pyproject.toml"
      - "LICENSE"
  # 后端启动脚本
  - from: electron/
    to: .
    filter:
      - "backend_launcher.py"

mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: packaging/app.icns
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: packaging/app-icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
  icon: packaging/app-icon.png
