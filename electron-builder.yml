# electron-builder configuration for ZLink Agent
#   npx electron-builder --mac --config electron-builder.yml   # macOS .dmg
#   npx electron-builder --win --config electron-builder.yml   # Windows .exe

appId: com.zlink.agent
productName: ZLink Agent
copyright: Copyright 2026

directories:
  output: dist-electron
  buildResources: packaging

files:
  - electron/**/*
  - web/dist/**/*

asarUnpack:
  - web/dist/**

asar: true

extraResources:
  # 自包含 Python 运行环境 (build by scripts/bundle-python.sh)
  - from: build/python-bundle/
    to: python-bundle
    filter:
      - "**/*"
  # 项目源码
  - from: .
    to: app
    filter:
      - "backend/**/*.py"
      - "agent/**/*"
      - "!agent/**/__pycache__/**"
      - "!agent/**/*.pyc"
      - "scripts/**/*.py"
      - "packaging/**/*"
      - "requirements.txt"
      - "pyproject.toml"
      - "LICENSE"
  # Chart MCP server (预置, npx @antv/mcp-server-chart)
  - from: node_modules/@antv/mcp-server-chart/
    to: mcp-chart
    filter:
      - "**/*"
  # 后端启动脚本
  - from: electron/
    to: .
    filter:
      - "backend_launcher.py"

mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: [arm64]
  icon: packaging/app.icns
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: packaging/app-icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
