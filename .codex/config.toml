# =============================================================================
# YS-Agent — Project-level Codex baseline (ECC)
# =============================================================================
# This file is the per-project override for Codex CLI / Codex Desktop when
# working inside /Users/zuoxiaojun/vibecoding/YS-Agent.
#
# Effective merge order (later wins):
#   1. Codex defaults
#   2. ~/.codex/config.toml                          (user-level)
#   3. ~/.codex/mcp-configs/mcp-servers.json         (ECC managed reference)
#   4. ./.codex/config.toml                          (this file — project)
#
# What lives here vs. user-level:
#   - MCP server layout that this repo actively relies on   -> here
#   - model_provider / model / API keys / personal state    -> user-level
#   - desktop UI preferences (locale, followUpQueueMode, ..)-> user-level
#
# Section naming: Codex uses `[mcp_servers.<id>]` (singular, underscore).
# Canonical IDs match the ECC reference at ~/.codex/mcp-configs/mcp-servers.json.
# =============================================================================

# -----------------------------------------------------------------------------
# Multi-agent (Codex experimental). Required by the multi_agent_v1__* tools.
# -----------------------------------------------------------------------------
[features]
multi_agent = true

# -----------------------------------------------------------------------------
# MCP servers — ECC baseline (6 servers).
# Most entries only need `command` + `args`; fill `env` placeholders before use.
# IDs are lowercase; do NOT rename without updating skill/MCP references.
# -----------------------------------------------------------------------------

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]
# description: Live documentation lookup (resolve-library-id, query-docs).

[mcp_servers.exa]
command = "npx"
args = ["-y", "exa-mcp-server"]
# description: Neural web/code/company search via Exa API.
# env.EXA_API_KEY = "YOUR_EXA_API_KEY_HERE"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
# description: GitHub operations (PRs, issues, repos).
# env.GITHUB_PERSONAL_ACCESS_TOKEN = "YOUR_GITHUB_PAT_HERE"

[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]
# description: Persistent memory across sessions (graph store, local only).

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp", "--browser", "chrome"]
# description: Browser automation & E2E testing via Playwright.

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]
# description: Chain-of-thought reasoning helper.

# -----------------------------------------------------------------------------
# Project-local agent roles (Codex multi-agent).
# -----------------------------------------------------------------------------
[agents.explorer]
profile = "explorer"

[agents.reviewer]
profile = "reviewer"

[agents.docs-researcher]
profile = "docs-researcher"
