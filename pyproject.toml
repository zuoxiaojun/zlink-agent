[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zlink-agent"
version = "1.11.0"
description = "Smart Link to Your Business Systems - AI Agent for Multi-ERP Analysis"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0",
  "tiktoken>=0.9.0",
  "prometheus-client>=0.21.0",
  "cryptography>=42.0.0",
  "anthropic>=0.40.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart>=0.0.9",
  "mcp>=1.0.0",
  "oracledb>=2.0.0",
  "pymssql>=2.2.0",
  "sqlparse>=0.5.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40.0"]
dev = ["ruff>=0.11.0", "pytest>=8.0.0", "pytest-cov>=6.0.0"]
all = ["zlink-agent[browser]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "backend*", "mcp_server*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/main.py" = ["E402"]
"tests/*" = ["E501", "N802", "N803", "N806"]
"agent/skills/*" = ["E501", "F841", "N806", "E402"]
"mcp_server/*" = ["E501", "E402", "N806", "F401"]
"mcp_server/nc_mcp_server/**/*" = [
  "E501",
  "E402",
  "N806",
  "F401",
  "N802",
  "B905",
]
"agent/erp_clients/yonsuite/*" = [
  "E501",
  "N802",
  "N803",
  "N806",
  "N815",
  "B904",
  "E722",
  "F841",
  "E402",
]
"agent/tools/*.py" = ["E501", "B904"]
"agent/slash_commands.py" = ["B007"]
"agent/core/llm_providers/anthropic.py" = ["F841"]
"backend/api/*.py" = ["B904", "F841", "B008"]
"backend/__main__.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["agent", "backend"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 70
