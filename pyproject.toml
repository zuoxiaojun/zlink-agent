[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "zlink-agent"
version = "1.5.1"
description = "Smart Link to Your Business Systems - AI Agent for Multi-ERP Analysis"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "tiktoken>=0.9.0",
    "prometheus-client>=0.21.0",
    "cryptography>=42.0.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
]
nc = [
    "nc-mcp-server @ git+https://atomgit.com/gcw_cJbJuamU/nc-mcp-project.git@main#subdirectory=nc-mcp",
]
all = ["zlink-agent[web]"]
dev = ["pytest>=8.0.0"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/main.py" = ["E402"]
"tests/*" = ["E501", "N802", "N803", "N806"]
"agent/skills/*" = ["E501", "F841", "N806", "E402"]
"mcp_server/*" = ["E501", "E402", "N806", "F401"]
"agent/erp_clients/yonsuite/*" = ["E501", "N802", "N803", "N806", "N815", "B904", "E722", "F841", "E402"]
"agent/tools/*.py" = ["E501", "B904"]
"agent/slash_commands.py" = ["B007"]
"agent/core/llm_providers/anthropic.py" = ["F841"]
"backend/api/*.py" = ["B904", "F841", "B008"]
"backend/__main__.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["agent", "backend"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 70
