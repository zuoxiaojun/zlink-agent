image: node:20-bullseye

stages:
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip/
    - node_modules/
    - web/node_modules/

build-mac:
  stage: build
  tags:
    - macos
  script:
    # Python 环境
    - apt-get update && apt-get install -y python3-pip python3-venv
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install -r requirements.txt pyinstaller

    # 前端构建
    - cd web && npm ci && npm run build && cd ..

    # PyInstaller
    - source .venv/bin/activate
    - pyinstaller backend/ys-agent.spec --clean --noconfirm

    # Electron 依赖（用镜像加速）
    - ELECTRON_MIRROR="https://npmmirror.com/mirrors/electron/"
      ELECTRON_BUILDER_BINARIES_MIRROR="https://npmmirror.com/mirrors/electron-builder-binaries/"
      npm ci

    # electron-builder 构建 .app（跳过签名）
    - electron-builder --mac --config electron-builder.yml --publish=never || echo "electron-builder DMG stage may fail, using manual DMG"

    # 手动 ad-hoc 签名 + 创建 DMG（无开发者证书时）
    - |
      APP="dist/mac/YS-Agent.app"
      if [ -d "$APP" ]; then
        codesign --force --deep --sign - "$APP"
        hdiutil create -srcfolder "$APP" \
          -volname "YS-Agent" \
          -format UDZO -ov -scrub \
          "dist/YS-Agent-${CI_COMMIT_TAG:-1.3.0}-x64.dmg"
      fi

  artifacts:
    paths:
      - dist/YS-Agent-*.dmg
    expire_in: 30 days
  only:
    - tags
